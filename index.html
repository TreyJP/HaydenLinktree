<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hayden — all my links in one place." />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Hayden | Links</title>
  <link rel="icon" href="haydenpfp.jpeg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="haydenpfp.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="container">
    <header class="profile">
      <div class="avatar-wrap">
        <img
          id="avatar"
          class="avatar"
          src="haydenpfp.jpeg"
          alt="Hayden's profile picture"
          width="96"
          height="96"
        />
        <span class="avatar-ring"></span>
      </div>
      <h1 id="display-name" class="name">Hayden</h1>
      <p id="bio" class="bio">Creator · Builder · All my links below</p>
    </header>

    <section id="socials" class="socials socials-top" aria-label="Social media"></section>

    <nav id="links" class="links" aria-label="Links"></nav>

    <footer class="footer">
      <button id="copy-btn" class="share-btn" type="button" aria-label="Copy link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy link
      </button>
      <p class="footer-text">
        Want your own page?
        <a id="contact-link" href="#" class="footer-link">Reach out to me</a>
      </p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
