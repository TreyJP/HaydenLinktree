<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Hayden Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>

  <!-- Login -->
  <div id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h1>Admin Login</h1>
      <p>Manage your link page</p>
      <form id="login-form">
        <label>
          Username
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error-text" hidden></p>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard" hidden>
    <header class="admin-header">
      <div class="header-left">
        <h1>Link Editor</h1>
        <span id="save-status" class="save-status">All changes saved</span>
      </div>
      <div class="header-actions">
        <a href="/" target="_blank" class="btn btn-ghost">Preview Site</a>
        <button id="save-btn" type="button" class="btn btn-primary">Save Changes</button>
        <button id="logout-btn" type="button" class="btn btn-ghost">Logout</button>
      </div>
    </header>

    <main class="admin-main">
      <!-- Profile -->
      <section class="panel">
        <h2 class="panel-title">Profile</h2>
        <div class="form-grid">
          <label>
            Name
            <input type="text" id="profile-name" />
          </label>
          <label>
            Avatar URL
            <input type="text" id="profile-avatar" placeholder="haydenpfp.jpeg" />
          </label>
          <label class="full-width">
            Bio
            <input type="text" id="profile-bio" />
          </label>
        </div>
      </section>

      <!-- Sections -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Link Sections</h2>
          <button id="add-section-btn" type="button" class="btn btn-small">+ Add Section</button>
        </div>
        <p class="panel-hint">Drag sections and links to reorder</p>
        <div id="sections-list" class="sections-list"></div>
      </section>

      <!-- Socials -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Social Icons</h2>
          <button id="add-social-btn" type="button" class="btn btn-small">+ Add Social</button>
        </div>
        <div id="socials-list" class="socials-list"></div>
      </section>

      <!-- Footer -->
      <section class="panel">
        <h2 class="panel-title">Footer</h2>
        <label class="full-width">
          "Reach out" Instagram URL
          <input type="url" id="contact-instagram" placeholder="https://instagram.com/..." />
        </label>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
